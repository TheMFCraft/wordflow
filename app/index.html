<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <meta name="description" content="WordFlow — freundlicher Vokabeltrainer mit Karteikarten, Streaks und Lernstatistik." />
  <title>WordFlow — Vokabeltrainer</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app-stage">
    <div class="app-frame">
      <span class="island" aria-hidden="true"></span>
      <div class="screen">
        <div class="statusbar">
          <span class="num" id="clock">9:41</span>
          <span class="right" aria-hidden="true">
            <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
            <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
            <svg class="battery" viewBox="0 0 25 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
          </span>
        </div>
        <main class="content" id="view"></main>
        <div id="tabs"></div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <dialog id="profile-dialog" aria-labelledby="profile-title">
    <form id="profile-form" method="dialog">
      <h2 class="h2" id="profile-title">Profil</h2>
      <p class="meta" style="margin:8px 0 0">Name für die Begrüßung auf dem Home-Screen.</p>
      <div class="field">
        <label for="name-input">Dein Name</label>
        <input id="name-input" name="name" type="text" maxlength="24" autocomplete="nickname" required />
      </div>
      <button type="submit" class="btn-primary">Speichern</button>
      <button type="button" class="btn-link" commandfor="profile-dialog" command="close" id="profile-cancel">Abbrechen</button>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
