apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace = "app.wordflow.trainer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.wordflow.trainer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "2.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary true
        def localProperties = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) {
            localFile.withInputStream { localProperties.load(it) }
        }
        def cyloneId = (System.getenv("CYLONE_CLIENT_ID") ?: localProperties.getProperty("cylone.clientId") ?: "").replace("\"", "\\\"")
        def cyloneSecret = (System.getenv("CYLONE_CLIENT_SECRET") ?: localProperties.getProperty("cylone.clientSecret") ?: "").replace("\"", "\\\"")
        buildConfigField "String", "CYLONE_CLIENT_ID", "\"${cyloneId}\""
        buildConfigField "String", "CYLONE_CLIENT_SECRET", "\"${cyloneSecret}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2025.01.01")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.navigation:navigation-compose:2.8.7"
    implementation "androidx.datastore:datastore-preferences:1.1.2"

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.1"

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.browser:browser:1.8.0"
}
