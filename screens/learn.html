<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WordFlow — Lernen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      oklch(98.5% 0.008 90);
      --surface: oklch(100% 0 0);
      --fg:      oklch(20% 0.01 60);
      --muted:   oklch(55% 0.015 70);
      --border:  oklch(93% 0.01 85);
      --accent:  oklch(70% 0.16 55);
      --accent-2: oklch(82% 0.14 85);
      --success: oklch(65% 0.15 145);
      --error:   oklch(62% 0.18 25);
      --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
      --font-display: 'Nunito', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;
      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;
      --radius-card: 18px;
      --radius-pill: 999px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 0;
      margin: 0;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 32px; }
    .caption { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 0 2px #000 inset, 0 28px 60px -12px rgba(0,0,0,0.45), 0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }
    .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }
    .island { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 5; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 16px; }
    .row     { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
      font-weight: 800;
    }
    .header .icon-btn {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--fg);
    }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }

    .greeting {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .h2  { font-family: var(--font-display); font-size: var(--fs-h2); letter-spacing: -0.015em; line-height: 1.2; margin: 0; font-weight: 700; }
    .h3  { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; margin: 0; font-family: var(--font-display); }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
    }

    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
    }
    .btn-secondary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
    }

    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Progress bar */
    .progress { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.5s ease; }

    /* Flashcard */
    .flashcard-container {
      perspective: 1000px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      height: 320px;
    }
    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .flashcard.flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
    }
    .flashcard-front {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 0 8px 32px -8px rgba(0,0,0,0.08);
    }
    .flashcard-back {
      background: linear-gradient(135deg, var(--accent), oklch(65% 0.18 45));
      color: #fff;
      transform: rotateY(180deg);
      box-shadow: 0 8px 32px -8px color-mix(in oklch, var(--accent) 30%, transparent);
    }
    .flashcard-word {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      line-height: 1.1;
    }
    .flashcard-phonetic {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 16px;
    }
    .flashcard-back .flashcard-phonetic { color: rgba(255,255,255,0.7); }
    .flashcard-example {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
      max-width: 24ch;
    }
    .flashcard-back .flashcard-example { color: rgba(255,255,255,0.8); }
    .flashcard-tap-hint {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .flashcard-back .flashcard-tap-hint { color: rgba(255,255,255,0.5); }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 12px;
      padding: 0 20px;
      margin-top: 20px;
    }
    .action-btn {
      flex: 1;
      min-height: 52px;
      border-radius: 16px;
      border: 0;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.know {
      background: color-mix(in oklch, var(--success) 14%, var(--surface));
      color: var(--success);
      border: 1.5px solid color-mix(in oklch, var(--success) 25%, var(--border));
    }
    .action-btn.know:hover { box-shadow: 0 4px 16px color-mix(in oklch, var(--success) 18%, transparent); }
    .action-btn.dont-know {
      background: color-mix(in oklch, var(--error) 10%, var(--surface));
      color: var(--error);
      border: 1.5px solid color-mix(in oklch, var(--error) 20%, var(--border));
    }
    .action-btn.dont-know:hover { box-shadow: 0 4px 16px color-mix(in oklch, var(--error) 14%, transparent); }
    .action-btn .btn-sub {
      font-size: 10px;
      font-weight: 600;
      opacity: 0.6;
      letter-spacing: 0.04em;
    }

    /* Progress dots */
    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
    }
    .dot.done { background: var(--success); }
    .dot.current { background: var(--accent); width: 24px; border-radius: 999px; }
    .dot.wrong { background: var(--error); }

    /* Word counter */
    .word-counter {
      text-align: center;
      margin-top: 12px;
    }
    .word-counter .num {
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>WordFlow</strong> · Lernen</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>

      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
            <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
          </span>
        </div>

        <main class="content" data-od-id="content">
          <div class="header" data-od-id="header">
            <div>
              <p class="greeting">Spanisch · Alltag</p>
              <h1>Karteikarten</h1>
            </div>
            <button class="icon-btn" aria-label="Beenden">
              <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <section class="pad" data-od-id="progress-bar" style="margin-bottom: 16px;">
            <div class="row-between" style="margin-bottom: 8px;">
              <span class="meta">Fortschritt</span>
              <span class="meta num">7 / 12</span>
            </div>
            <div class="progress"><span style="width: 58%;"></span></div>
          </section>

          <section class="pad" data-od-id="flashcard" style="margin-bottom: 8px;">
            <div class="flashcard-container">
              <div class="flashcard" id="flashcard" onclick="this.classList.toggle('flipped')">
                <div class="flashcard-face flashcard-front">
                  <span class="pill" style="margin-bottom: 16px;">Substantiv</span>
                  <p class="flashcard-word">mariposa</p>
                  <p class="flashcard-phonetic">/ma.ɾi.ˈpo.sa/</p>
                  <p class="flashcard-example">"La mariposa vuela en el jardín."</p>
                  <span class="flashcard-tap-hint">Tippen zum Umdrehen</span>
                </div>
                <div class="flashcard-face flashcard-back">
                  <span class="pill" style="margin-bottom: 16px; background: rgba(255,255,255,0.2); color: #fff;">Übersetzung</span>
                  <p class="flashcard-word">Schmetterling</p>
                  <p class="flashcard-phonetic">Substantiv · maskulin</p>
                  <p class="flashcard-example">"Der Schmetterling fliegt im Garten."</p>
                  <span class="flashcard-tap-hint">Tippen zum Umdrehen</span>
                </div>
              </div>
            </div>
          </section>

          <div class="action-row" data-od-id="actions">
            <button class="action-btn dont-know" aria-label="Nochmal lernen">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
              <span class="btn-sub">Nochmal</span>
            </button>
            <button class="action-btn know" aria-label="Gewusst">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
              <span class="btn-sub">Gewusst</span>
            </button>
          </div>

          <div class="progress-dots" data-od-id="dots">
            <span class="dot done"></span>
            <span class="dot done"></span>
            <span class="dot wrong"></span>
            <span class="dot done"></span>
            <span class="dot done"></span>
            <span class="dot done"></span>
            <span class="dot current"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>

          <div class="word-counter">
            <span class="num">7 von 12 Wörtern</span>
          </div>
        </main>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>

  <script>
    // Simple flip interaction
    const card = document.getElementById('flashcard');
    if (card) {
      card.addEventListener('click', function() {
        this.classList.toggle('flipped');
      });
    }
  </script>
</body>
</html>
