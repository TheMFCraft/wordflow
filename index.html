<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WordFlow — Vokabeltrainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: oklch(98.5% 0.008 90);
      --surface: oklch(100% 0 0);
      --fg: oklch(20% 0.01 60);
      --muted: oklch(55% 0.015 70);
      --border: oklch(93% 0.01 85);
      --accent: oklch(70% 0.16 55);
      --accent-2: oklch(82% 0.14 85);
      --success: oklch(65% 0.15 145);
      --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --font-display: 'Nunito', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* Launcher */
    .launcher {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
      background:
        radial-gradient(70% 50% at 50% 0%, color-mix(in oklch, var(--accent) 8%, var(--bg)) 0%, var(--bg) 70%);
    }
    .launcher-header {
      text-align: center;
      margin-bottom: 48px;
    }
    .launcher-header h1 {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .launcher-header p {
      color: var(--muted);
      font-size: 16px;
      margin: 0;
    }
    .open-app {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      min-height: 52px;
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--accent), oklch(65% 0.18 45));
      color: #fff;
      text-decoration: none;
      border-radius: 16px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 8px 24px color-mix(in oklch, var(--accent) 28%, transparent);
    }
    .open-app:hover { transform: translateY(-1px); }
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      max-width: 1640px;
      width: 100%;
    }
    @media (max-width: 1400px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .gallery { grid-template-columns: 1fr; max-width: 420px; } }

    .screen-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .screen-link:hover .device { transform: translateY(-4px); box-shadow: 0 32px 64px -16px rgba(0,0,0,0.22); }
    .screen-link .label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .screen-link .sublabel {
      font-size: 13px;
      color: var(--muted);
      margin-top: -10px;
    }

    /* Device frame (compact) */
    .device {
      position: relative;
      width: 320px;
      height: 694px;
      border-radius: 48px;
      padding: 10px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 24px 48px -12px rgba(0,0,0,0.35),
        0 8px 16px -6px rgba(0,0,0,0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 2px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.05) 10%, transparent 18%, transparent 82%, rgba(255,255,255,0.03) 90%, transparent 100%);
      top: 80px;
      bottom: 80px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }
    .island {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 30px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }
    .screen-surface {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 40px;
      overflow: hidden;
    }
    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.8;
    }

    /* iframe content styling */
    .screen-surface iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 40px;
    }
  </style>
</head>
<body>
  <div class="launcher" data-od-id="launcher">
    <div class="launcher-header" data-od-id="launcher-header">
      <h1>WordFlow</h1>
      <p>Vokabeltrainer — lerne mit Karteikarten, Streaks und Statistik</p>
      <a class="open-app" href="app/index.html">App öffnen</a>
    </div>

    <div class="gallery" data-od-id="gallery">
      <a href="screens/home.html" class="screen-link" data-od-id="link-home">
        <div class="device">
          <span class="island" aria-hidden></span>
          <div class="screen-surface">
            <iframe src="screens/home.html" loading="lazy" title="Home Screen"></iframe>
            <div class="home-indicator" aria-hidden></div>
          </div>
        </div>
        <span class="label">Home</span>
        <span class="sublabel">Sprachauswahl & Fortschritt</span>
      </a>

      <a href="screens/learn.html" class="screen-link" data-od-id="link-learn">
        <div class="device">
          <span class="island" aria-hidden></span>
          <div class="screen-surface">
            <iframe src="screens/learn.html" loading="lazy" title="Lern-Screen"></iframe>
            <div class="home-indicator" aria-hidden></div>
          </div>
        </div>
        <span class="label">Lernen</span>
        <span class="sublabel">Karteikarten & Flip</span>
      </a>

      <a href="screens/stats.html" class="screen-link" data-od-id="link-stats">
        <div class="device">
          <span class="island" aria-hidden></span>
          <div class="screen-surface">
            <iframe src="screens/stats.html" loading="lazy" title="Statistik-Screen"></iframe>
            <div class="home-indicator" aria-hidden></div>
          </div>
        </div>
        <span class="label">Statistik</span>
        <span class="sublabel">Lernkurve & Erfolg</span>
      </a>

      <a href="screens/paywall.html" class="screen-link" data-od-id="link-paywall">
        <div class="device">
          <span class="island" aria-hidden></span>
          <div class="screen-surface">
            <iframe src="screens/paywall.html" loading="lazy" title="Paywall Screen"></iframe>
            <div class="home-indicator" aria-hidden></div>
          </div>
        </div>
        <span class="label">Upgrade</span>
        <span class="sublabel">Pro freischalten</span>
      </a>
    </div>
  </div>
</body>
</html>
